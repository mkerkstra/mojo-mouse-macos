name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: ./scripts/test.sh
      - run: ./scripts/build.sh
      - run: '"build/Mojo Mouse.app/Contents/MacOS/MojoMouse" --version'
      - run: '"build/Mojo Mouse.app/Contents/MacOS/MojoMouse" --diagnose'
  publish:
    needs: test
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Sources/MojoMouse/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: ./scripts/package.sh
      - name: Publish executable downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Mojo Mouse $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/Mojo-Mouse-macOS-universal.dmg dist/Mojo-Mouse-macOS-universal.zip dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
