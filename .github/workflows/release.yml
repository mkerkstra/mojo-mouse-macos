name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Sources/MojoMouse/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: ./scripts/package.sh
      - name: Publish executable downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != true ]; then
              echo "A published release already exists. Publish fixes under a new version."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Mojo Mouse $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/Mojo-Mouse-macOS-universal.dmg dist/Mojo-Mouse-macOS-universal.zip dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
