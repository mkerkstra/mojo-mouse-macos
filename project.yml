name: PointerProfiles
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_ENABLE_MODULES: YES
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3F6D3J9V8M
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PointerProfiles:
    type: application
    platform: macOS
    productName: Pointer Profiles
    sources:
      - path: Sources/MojoMouse
        excludes: [Resources, Info.plist, AppIcon.icns]
      - path: Sources/MojoMouse/Resources
        buildPhase: resources
      - path: Distribution/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mkerkstra.PointerProfiles
        INFOPLIST_FILE: Distribution/Store-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Distribution/Store.entitlements
        ENABLE_APP_SANDBOX: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) APP_STORE'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '1.0'
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
schemes:
  PointerProfiles:
    build:
      targets:
        PointerProfiles: all
    archive:
      config: Release
